  <title id="title">PIT-CP logo</title>
  <desc id="desc">A smooth pivotal curve inside an adaptive prediction band.</desc>
  <defs>
    <linearGradient id="surface" x1="24" y1="20" x2="230" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F2358"/>
