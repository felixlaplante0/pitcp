[project]
name = "pitcp"
description = "PIT-CP conformal prediction with pivotal scores"
readme = "README.md"
authors = [{ name = "Félix Laplante" }]
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy", "torch", "scikit-learn", "zuko", "tqdm"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
test = [
    "catboost",
    "lightgbm",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "xgboost",
]

[project.urls]
Source = "https://github.com/felixlaplante0/pitcp"
Documentation = "https://pitcp.readthedocs.io/en/latest/"
Playground = "https://pitcp-app.streamlit.app/"

[build-system]
requires = ["setuptools>=77", "setuptools-scm[toml]>=6.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pitcp*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.package-data]
pitcp = ["py.typed"]

[tool.ruff]
extend-exclude = ["data", "scripts"]
lint.select = [
    "D",   # pydocstyle (docstring conventions)
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate (commented code)
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
lint.ignore = ["D417", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"pitcp/utils/_volume.py" = ["PLC0415"]
"tests/**/*.py" = ["S101"]
